<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ridge Hunter's Trail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500;700&display=swap" />
  <style>
    /* height:100svh：svh 是「小視窗」單位，假設瀏覽器介面永遠顯示，因此網址列
       收合時它不會跟著變。dvh 剛好相反——它的定義就是隨介面伸縮而持續變動，
       用在這裡會讓 Phaser 的 Scale.RESIZE 不斷改變畫布大小、場景不斷重啟。
       代價是網址列收合時底部可能露出一小條底色；配合下方的 overflow:hidden，
       頁面本來就沒有可捲動的內容，多數瀏覽器因此不會去收合網址列。
       舊瀏覽器不認得 svh，會忽略這一段而沿用前面的 100%。 */
    html, body { margin: 0; padding: 0; background: #131a17; height: 100%; height: 100svh; }
    /* overflow/overscroll：擋掉下拉重新整理與橡皮筋捲動，兩者都會搶走遊戲的觸控。 */
    body { overflow: hidden; overscroll-behavior: none; }
    #app { height: 100%; }
    /* touch-action:none 是本專案手機輸入延遲的主因——Phaser 從不設定它
       （node_modules/phaser 的 input/ 與 scale/ 全域搜尋零命中），
       瀏覽器因此要先判斷這次觸控是不是捲動或縮放手勢，才把 pointerdown 派送出去。
       tap-highlight 則是點擊時的灰色閃框，在遊戲畫面上只是雜訊。 */
    #app canvas { touch-action: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
