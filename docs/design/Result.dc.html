<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Karla:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #131a17; font-family: 'Karla', 'Segoe UI', sans-serif; }
    a { color: #d8c874; } a:hover { color: #e8dca2; }
  </style>
</helmet>
<div style="width: 720px; height: 780px; box-sizing: border-box; background: radial-gradient(80% 55% at 50% 30%, #1a241e 0%, #131a17 60%, #0d1310 100%); color: #e8e3d2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 40px;">

  <svg width="240" height="240" viewBox="0 0 240 240">
    <defs>
      <radialGradient id="rglow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#9ad1c8" stop-opacity="0.28"/>
        <stop offset="70%" stop-color="#9ad1c8" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#9ad1c8" stop-opacity="0"/>
      </radialGradient>
      <filter id="rsoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    </defs>
    <circle cx="120" cy="120" r="118" fill="url(#rglow)"/>
    <circle cx="120" cy="120" r="88" fill="none" stroke="#9ad1c8" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="2 7" stroke-linecap="round"/>
    <g transform="translate(120 126) scale(2.1)">
      <g fill="#0f1613">
        <path d="M-32 -4 Q-34 -14 -22 -16 Q-2 -20 12 -14 Q14 -24 20 -28 L22 -38 L25 -29 L32 -34 L30 -26 Q36 -24 34 -18 L26 -14 Q30 -6 22 -2 Q4 4 -14 2 Q-28 4 -32 -4 Z"/>
        <rect x="-30" y="0" width="4.5" height="26" rx="2"/>
        <rect x="-20" y="1" width="4.5" height="25" rx="2"/>
        <rect x="8" y="0" width="4.5" height="26" rx="2"/>
        <rect x="17" y="-2" width="4.5" height="28" rx="2"/>
      </g>
      <circle cx="24" cy="-24" r="1.8" fill="#9ad1c8"/>
      <circle cx="-34" cy="-10" r="4" fill="#9ad1c8" opacity="0.35" filter="url(#rsoft)"/>
      <circle cx="-40" cy="-14" r="2.5" fill="#9ad1c8" opacity="0.25" filter="url(#rsoft)"/>
    </g>
  </svg>

  <div style="text-align: center;">
    <div style="font-family: 'Marcellus', Georgia, serif; font-size: 32px; letter-spacing: 1px;">Mistfawn recorded!</div>
    <div style="margin-top: 4px; font-size: 12px; letter-spacing: 3px; color: #8a9a8c; text-transform: uppercase;">Field Guide · 3 of 8</div>
  </div>

  <svg width="220" height="10" viewBox="0 0 220 10">
    <path d="M4 5 Q60 2 110 5 Q160 8 216 5" stroke="#d8c874" stroke-opacity="0.5" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </svg>

  <div style="max-width: 430px; text-align: center; font-size: 16px; line-height: 1.65; color: #a9a698;">
    A gentle grazer that melts into morning fog when startled. Prefers the misted hollows below the ridge line.
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 10px;">
    <div style="width: 250px; height: 52px; display: flex; align-items: center; justify-content: center; background: linear-gradient(100deg, #c9b968, #d8c874); color: #131a17; font-weight: 700; font-size: 17px; letter-spacing: 2px; border-radius: 11px 4px 10px 5px;">NEXT HUNT</div>
    <div style="width: 250px; height: 50px; display: flex; align-items: center; justify-content: center; border: 1.5px solid rgba(216,200,116,0.65); color: #d8c874; font-weight: 500; font-size: 16px; letter-spacing: 2px; border-radius: 5px 11px 4px 10px; box-sizing: border-box;">FIELD GUIDE</div>
  </div>
</div>
</x-dc>
</body>
</html>
