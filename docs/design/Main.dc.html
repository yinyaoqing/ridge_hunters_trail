<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Karla:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #131a17; font-family: 'Karla', 'Segoe UI', sans-serif; }
    a { color: #d8c874; } a:hover { color: #e8dca2; }
  </style>
</helmet>
<div style="width: 720px; height: 780px; box-sizing: border-box; background: radial-gradient(120% 90% at 50% 0%, #182219 0%, #131a17 60%, #0e1412 100%); color: #e8e3d2; display: flex; flex-direction: column; gap: 10px; padding: 14px 30px 14px;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <circle cx="15" cy="15" r="12.5" stroke="#d8c874" stroke-width="1.6"/>
        <circle cx="15" cy="15" r="9.5" stroke="#d8c874" stroke-width="0.8" stroke-opacity="0.5"/>
        <path d="M15 6.5 L17.4 15 L15 23.5 L12.6 15 Z" fill="#d8c874"/>
        <circle cx="15" cy="15" r="1.6" fill="#131a17"/>
      </svg>
      <div>
        <div style="font-family: 'Marcellus', Georgia, serif; font-size: 20px; letter-spacing: 1px;">Round 3</div>
        <div style="font-size: 11px; letter-spacing: 2.5px; color: #8a9a8c; text-transform: uppercase;">Ridge Hunter's Trail</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 10.5px; letter-spacing: 2.5px; color: #8a9a8c;">STAMINA · 28 / 45</div>
      <div style="width: 230px; height: 13px; background: #0d1310; border: 1px solid rgba(232,227,210,0.18); border-radius: 8px 3px 7px 4px;">
        <div style="width: 62%; height: 100%; background: linear-gradient(90deg, #a99548, #d8c874); border-radius: 7px 2px 6px 3px;"></div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="text-align: right; font-size: 11.5px; line-height: 1.55; color: #8a9a8c;">
        <div>Move · click or arrow keys</div>
        <div>Mark · shift + click</div>
      </div>
      <div style="padding: 7px 11px; border: 1.2px solid rgba(216,200,116,0.55); border-radius: 9px 4px 8px 5px; color: #d8c874; font-size: 12.5px; letter-spacing: 1px;">EN / 中</div>
    </div>
  </div>

  <svg width="660" height="646" viewBox="0 0 660 646" style="display: block; border-radius: 10px 14px 8px 12px;">
    <defs>
      <filter id="wash" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
      <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
        <path d="M44 0H0V44" fill="none" stroke="#e8e3d2" stroke-opacity="0.06"/>
      </pattern>
      <radialGradient id="vig" cx="50%" cy="45%" r="75%">
        <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
      </radialGradient>
      <radialGradient id="pg" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#d8c874" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#d8c874" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="cone" x1="0%" y1="100%" x2="80%" y2="0%">
        <stop offset="0%" stop-color="#d8c874" stop-opacity="0.26"/>
        <stop offset="100%" stop-color="#d8c874" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <rect width="660" height="646" fill="#16211b"/>
    <g filter="url(#wash)">
      <ellipse cx="180" cy="140" rx="190" ry="120" fill="#24352c"/>
      <ellipse cx="520" cy="120" rx="170" ry="110" fill="#2c3f42"/>
      <ellipse cx="480" cy="430" rx="220" ry="160" fill="#3a5244"/>
      <ellipse cx="140" cy="520" rx="170" ry="130" fill="#24352c"/>
      <ellipse cx="330" cy="300" rx="120" ry="90" fill="#4a3c2c" opacity="0.7"/>
    </g>
    <rect width="660" height="646" fill="url(#grid)"/>
    <rect width="660" height="646" fill="url(#vig)"/>

    <path d="M141 471 L470 330 L390 200 Z" fill="url(#cone)"/>
    <path d="M141 471 L470 330 M141 471 L390 200" stroke="#d8c874" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="1 6" stroke-linecap="round" fill="none"/>

    <circle cx="500" cy="470" r="126" fill="none" stroke="#9ad1c8" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>

    <circle cx="430" cy="165" r="84" fill="#d8c874" fill-opacity="0.05" stroke="#d8c874" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="7 9" stroke-linecap="round"/>

    <g transform="translate(141 471)">
      <circle r="13" fill="#131a17" stroke="#d8c874" stroke-width="1.5"/>
      <g fill="#d8c874">
        <ellipse cx="-3" cy="-4" rx="2.3" ry="3.4"/>
        <ellipse cx="3" cy="-4" rx="2.3" ry="3.4"/>
        <ellipse cx="0" cy="3.5" rx="4.6" ry="3.6"/>
      </g>
    </g>

    <g transform="translate(430 165)">
      <circle r="13" fill="#131a17" stroke="#d8c874" stroke-width="1.5"/>
      <g stroke="#d8c874" fill="none" stroke-width="1.6" stroke-linecap="round">
        <path d="M-6 3 A6.5 6.5 0 1 1 4 5.5"/>
        <path d="M-2.5 0.5 A3 3 0 1 1 1.5 2.6"/>
      </g>
    </g>

    <g transform="translate(500 470)">
      <circle r="13" fill="#131a17" stroke="#9ad1c8" stroke-width="1.5"/>
      <g stroke="#9ad1c8" fill="none" stroke-width="1.6" stroke-linecap="round">
        <path d="M-4.5 6 Q-7 2 -4.5 -1 Q-2 -4 -4.5 -7"/>
        <path d="M0 7 Q-2.5 3 0 0 Q2.5 -3 0 -6"/>
        <path d="M4.5 6 Q2 2 4.5 -1 Q7 -4 4.5 -7"/>
      </g>
    </g>

    <g transform="translate(308 336)" opacity="0.75">
      <circle r="13" fill="#131a17" stroke="#d8c874" stroke-width="1.5" stroke-opacity="0.7"/>
      <g fill="#d8c874" fill-opacity="0.7">
        <ellipse cx="-3" cy="-4" rx="2.3" ry="3.4"/>
        <ellipse cx="3" cy="-4" rx="2.3" ry="3.4"/>
        <ellipse cx="0" cy="3.5" rx="4.6" ry="3.6"/>
      </g>
    </g>

    <g transform="translate(220 180)">
      <path d="M0 8 Q-9 0 0 -9 Q9 0 0 8 Z" fill="#a8d08d" fill-opacity="0.9"/>
      <path d="M0 6 Q0 -1 0 -6" stroke="#131a17" stroke-width="1" fill="none"/>
    </g>
    <g transform="translate(560 300)">
      <path d="M0 -5 Q2 -9 5 -10" stroke="#a8d08d" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <circle r="5.5" fill="#8fb8de"/>
      <circle cx="-1.8" cy="-1.8" r="1.5" fill="#e8e3d2" fill-opacity="0.8"/>
    </g>

    <g stroke="#d9764a" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <path d="M380 386 L398 404 M398 386 L380 404"/>
      <path d="M424 430 L442 448 M442 430 L424 448"/>
    </g>

    <circle cx="96" cy="560" r="26" fill="url(#pg)"/>
    <circle cx="96" cy="560" r="12.5" fill="none" stroke="#e8e3d2" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="96" cy="560" r="9" fill="#e8e3d2"/>
  </svg>

  <div style="display: flex; justify-content: space-between; font-size: 12px; color: #8a9a8c;">
    <div>3 of 4 clues read</div>
    <div>Supplies restore stamina · the trail fades if you run dry</div>
  </div>
</div>
</x-dc>
</body>
</html>
